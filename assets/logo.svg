<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Motion Story logo">
  <defs>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1E5C"/>
      <stop offset="1" stop-color="#14102E"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FE0C8"/>
      <stop offset="1" stop-color="#08A89A"/>
    </linearGradient>
  </defs>
  <!-- storyboard frames trailing behind: the story in motion -->
  <rect x="40" y="28" width="148" height="148" rx="26" fill="#6848ED" opacity="0.25" transform="rotate(-11 114 102)"/>
  <rect x="49" y="40" width="148" height="148" rx="26" fill="#6848ED" opacity="0.5" transform="rotate(-5.5 123 114)"/>
  <!-- front frame -->
  <rect x="58" y="52" width="148" height="148" rx="26" fill="url(#frameGrad)" stroke="#6848ED" stroke-width="3"/>
  <!-- keyframe dots -->
  <circle cx="83" cy="77" r="5.5" fill="#6848ED"/>
  <circle cx="181" cy="175" r="5.5" fill="#08A89A"/>
  <!-- play triangle -->
  <path d="M108 92 L108 160 L166 126 Z" fill="url(#playGrad)" stroke="url(#playGrad)" stroke-width="11" stroke-linejoin="round"/>
</svg>
